<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patitas Felices - Dueños</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Clínica Veterinaria Patitas Felices</span>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Dueños</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDuenio">
            Nuevo Dueño
        </button>
    </div>

    <div id="errorTabla" class="alert alert-danger d-none"></div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cédula</th>
            <th>Teléfono</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody id="tablaDuenios"></tbody>
    </table>
</main>

<div class="modal fade" id="modalDuenio" tabindex="-1">
    <div class="modal-dialog">
        <form id="formDuenio" class="modal-content" novalidate>
            <div class="modal-header">
                <h2 class="modal-title h5">Nuevo Dueño</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="mb-2">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input id="apellido" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="cedula" class="form-label">Cédula</label>
                    <input id="cedula" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input id="telefono" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" class="form-control">
                </div>

                <div id="errorFormulario" class="alert alert-danger d-none mb-0"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:8080/api/duenio';

    const modal = document.getElementById('modalDuenio');
    const formulario = document.getElementById('formDuenio');
    const cuerpoTabla = document.getElementById('tablaDuenios');
    const errorTabla = document.getElementById('errorTabla');
    const errorFormulario = document.getElementById('errorFormulario');

    document.addEventListener('DOMContentLoaded', cargarDuenios);
    formulario.addEventListener('submit', crearDuenio);

    // Cada vez que se abre el modal, el formulario arranca limpio
    modal.addEventListener('show.bs.modal', () => {
        formulario.reset();
        ocultar(errorFormulario);
    });

    // GET /api/duenio → llena la tabla
    async function cargarDuenios() {
        ocultar(errorTabla);
        try {
            const respuesta = await fetch(API_URL);
            if (!respuesta.ok) {
                const error = await leerError(respuesta);
                mostrar(errorTabla, error.mensaje);
                return;
            }

            const duenios = await respuesta.json();
            cuerpoTabla.innerHTML = '';

            if (duenios.length === 0) {
                cuerpoTabla.innerHTML = '<tr><td colspan="6" class="text-center">No hay dueños registrados</td></tr>';
                return;
            }

            duenios.forEach(duenio => {
                const fila = document.createElement('tr');
                [duenio.id, duenio.nombre, duenio.apellido, duenio.cedula, duenio.telefono, duenio.email]
                    .forEach(valor => {
                        const celda = document.createElement('td');
                        celda.textContent = valor;
                        fila.appendChild(celda);
                    });
                cuerpoTabla.appendChild(fila);
            });
        } catch (e) {
            mostrar(errorTabla, 'No se pudo conectar con el servidor. ¿Está levantado el backend en el puerto 8080?');
        }
    }

    // POST /api/duenio → crea el dueño y refresca la tabla sin recargar
    async function crearDuenio(evento) {
        evento.preventDefault();
        ocultar(errorFormulario);

        const duenio = {
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            cedula: document.getElementById('cedula').value,
            telefono: document.getElementById('telefono').value,
            email: document.getElementById('email').value
        };

        try {
            const respuesta = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(duenio)
            });

            if (!respuesta.ok) {
                const error = await leerError(respuesta);
                mostrar(errorFormulario, error.mensaje);
                return;
            }

            bootstrap.Modal.getOrCreateInstance(modal).hide();
            await cargarDuenios();
        } catch (e) {
            mostrar(errorFormulario, 'No se pudo conectar con el servidor. ¿Está levantado el backend en el puerto 8080?');
        }
    }

    // Lee el ErrorResponse del backend; si la respuesta no es JSON, arma un mensaje genérico
    async function leerError(respuesta) {
        try {
            return await respuesta.json();
        } catch {
            return { mensaje: 'Error ' + respuesta.status };
        }
    }

    function mostrar(elemento, mensaje) {
        elemento.textContent = mensaje;
        elemento.classList.remove('d-none');
    }

    function ocultar(elemento) {
        elemento.classList.add('d-none');
    }
</script>
</body>
</html>
